<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحجز الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5b5fc7;
            /* Purple/Blue from image */
            --primary-hover: #4a4eb0;
            --secondary-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f1c40f;
            --bg-color: #f8f9fa;
            --surface-color: #ffffff;
            --text-color: #333333;
            --text-muted: #777777;
            --border-color: #eaedf1;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 8px;
            --transition: all 0.2s ease;
        }

        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            background-color: var(--surface-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Login Screen */
        #loginScreen {
            max-width: 360px;
            margin: 15vh auto;
            padding: 40px 30px;
            background: var(--surface-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        #loginScreen h2 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 30px;
        }

        #loginScreen input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-sizing: border-box;
            font-family: inherit;
        }

        #loginScreen button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: var(--radius);
            font-family: inherit;
            font-weight: 700;
            font-size: 16px;
            margin-top: 15px;
        }

        /* Layout */
        #appScreen {
            display: none;
            height: 100%;
            flex-direction: row;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--surface-color);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-section h4 {
            margin: 0 0 15px 0;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 600;
        }

        .date-picker-container input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-family: inherit;
            font-weight: 600;
            color: var(--text-color);
            box-sizing: border-box;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-label input[type="checkbox"],
        .filter-label input[type="radio"] {
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
        }

        .user-info {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-info button {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: var(--radius);
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            color: var(--text-color);
        }

        .user-info button:hover {
            background: var(--border-color);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            overflow: hidden;
        }

        .top-header {
            background: var(--surface-color);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--text-color);
        }

        /* Matrix Table */
        .matrix-container {
            flex: 1;
            overflow: auto;
            background: var(--surface-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th,
        td {
            border: 1px solid var(--border-color);
            padding: 0;
            min-width: 80px;
            height: 50px;
            position: relative;
        }

        /* Sticky Headers & Columns */
        thead th {
            position: sticky;
            top: 0;
            background: var(--surface-color);
            z-index: 10;
            padding: 15px 5px;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }

        .room-col {
            position: sticky;
            right: 0;
            background: var(--surface-color);
            z-index: 9;
            text-align: right;
            padding: 0 15px;
            font-weight: 600;
            font-size: 14px;
            min-width: 200px;
            max-width: 200px;
            border-left: 1px solid var(--border-color);
        }

        thead th.room-col {
            z-index: 11;
        }

        /* Current Time Highlight */
        .current-time-header {
            color: var(--primary-color);
            font-weight: 700;
        }

        .current-time-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            margin-top: 5px;
            font-size: 16px;
        }

        /* Time Slots */
        .time-slot {
            cursor: pointer;
            transition: var(--transition);
        }

        .time-slot:hover {
            background-color: rgba(91, 95, 199, 0.05);
        }

        .time-slot.past-time {
            background: repeating-linear-gradient(45deg,
                    #f9f9f9,
                    #f9f9f9 10px,
                    #f0f0f0 10px,
                    #f0f0f0 20px);
            cursor: not-allowed;
        }

        .time-slot.past-time:hover {
            background: repeating-linear-gradient(45deg,
                    #f9f9f9,
                    #f9f9f9 10px,
                    #f0f0f0 10px,
                    #f0f0f0 20px);
        }

        /* Hover Plus Icon */
        .hover-plus {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--primary-color);
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }

        .time-slot:not(.past-time):not(.has-booking):hover .hover-plus {
            display: block;
        }

        /* Booking States */
        .booking-event {
            margin: 4px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: white;
        }

        .state-pending {
            background-color: var(--warning-color);
            color: #000;
        }

        .state-approved {
            background-color: var(--primary-color);
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--surface-color);
            padding: 30px;
            border-radius: var(--radius);
            width: 400px;
            max-width: 90%;
            box-shadow: var(--shadow-lg);
        }

        .modal-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .modal-box label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            font-size: 13px;
        }

        .modal-box input,
        .modal-box select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-sizing: border-box;
            font-family: inherit;
        }

        .modal-actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color) !important;
        }

        .btn-danger {
            background: var(--secondary-color);
            color: white;
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        /* Toasts */
        #toast-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--surface-color);
            padding: 15px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 10px;
            border-right: 4px solid var(--primary-color);
            font-weight: 600;
            font-size: 14px;
        }

        .toast.success {
            border-right-color: var(--success-color);
        }

        .toast.error {
            border-right-color: var(--secondary-color);
        }

        .toast.warning {
            border-right-color: var(--warning-color);
        }
    </style>
</head>

<body>

    <div id="toast-container"></div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <h2>نظام الحجز الذكي</h2>
        <input type="text" id="username" placeholder="اسم المستخدم (user / admin)">
        <input type="password" id="password" placeholder="كلمة المرور (1234 / 1004)">
        <button onclick="login()">تسجيل الدخول</button>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appScreen">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-section">
                <h4>تاريخ الحجز</h4>
                <div class="date-picker-container">
                    <input type="date" id="bookingDate" onchange="refreshUI()">
                </div>
            </div>

            <div class="sidebar-section">
                <h4>المبنى</h4>
                <div class="filter-group" id="buildingFilters">
                    <label class="filter-label"><input type="radio" name="building" value="all" checked
                            onchange="refreshUI()"> الكل</label>
                    <label class="filter-label"><input type="radio" name="building" value="الكنيسة"
                            onchange="refreshUI()"> الكنيسة</label>
                    <label class="filter-label"><input type="radio" name="building" value="مبنى الخدمات"
                            onchange="refreshUI()"> مبنى الخدمات</label>
                    <label class="filter-label"><input type="radio" name="building" value="مبنى الكرمة"
                            onchange="refreshUI()"> مبنى الكرمة</label>
                    <label class="filter-label"><input type="radio" name="building" value="النادي"
                            onchange="refreshUI()"> النادي</label>
                </div>
            </div>

            <div class="sidebar-section">
                <h4>حالة الحجز</h4>
                <div class="filter-group">
                    <label class="filter-label"><input type="checkbox" id="filterApproved" checked
                            onchange="refreshUI()"> موافق عليه</label>
                    <label class="filter-label"><input type="checkbox" id="filterPending" checked
                            onchange="refreshUI()"> قيد الانتظار</label>
                </div>
            </div>

            <div class="user-info">
                <div style="font-size: 14px;">مرحباً: <strong id="currentUserDisplay"></strong></div>
                <button onclick="logout()">تسجيل الخروج</button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="top-header">
                <div>
                    <h2>جدول الحجوزات</h2>
                    <div style="font-size: 12px; color: var(--secondary-color); margin-top: 5px;">مبنى الكرمة سيفتح في
                        حاله ان تم حجز مبني الكنيسه</div>
                </div>
                <div id="adminBadge"
                    style="display:none; background: var(--warning-color); padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;">
                    وضع الإدارة</div>
            </div>

            <div class="matrix-container">
                <table id="bookingMatrix">
                    <thead>
                        <tr id="timeHeaders">
                            <!-- Generated by JS -->
                        </tr>
                    </thead>
                    <tbody id="matrixBody">
                        <!-- Generated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="bookingModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">طلب حجز جديد</h3>
            <p style="font-size: 13px; color: var(--text-muted);" id="modalSubtitle"></p>

            <form id="bookingForm" onsubmit="submitBooking(event)">
                <label>اسم المسؤول عن الحجز</label>
                <input type="text" id="f_name" required>
                <label>اسم الخدمة</label>
                <input type="text" id="f_service" required>
                <label>رقم الهاتف</label>
                <input type="tel" id="f_phone" required>
                <label>عدد الأفراد</label>
                <input type="number" id="f_count" min="1" required>
                <label>السبب</label>
                <input type="text" id="f_reason" required>

                <div id="recurringSection" style="display:none; margin-top: 15px; padding: 10px; background: var(--bg-color); border-radius: var(--radius); border: 1px solid var(--border-color);">
                    <label style="margin-top: 0;"><input type="checkbox" id="f_recurring" onchange="document.getElementById('endDateSection').style.display = this.checked ? 'block' : 'none';"> حجز متكرر (أسبوعياً)</label>
                    <div id="endDateSection" style="display:none;">
                        <label>تاريخ الانتهاء</label>
                        <input type="date" id="f_end_date">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn-primary" id="btnSubmitForm">تأكيد الحجز</button>
                    <button type="button" class="btn-secondary" onclick="closeModals()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailsModal" class="modal-overlay">
        <div class="modal-box">
            <h3>تفاصيل الحجز</h3>
            <div id="detailsContent" style="font-size: 14px; line-height: 1.8;"></div>
            <div class="modal-actions" id="detailsActions"></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let selectedRoom = "";
        let selectedTime = "";
        let selectedBookingId = null;

        if (!localStorage.getItem('bookingsDB')) { localStorage.setItem('bookingsDB', JSON.stringify([])); }

        const scheduleData = [
            { building: "الكنيسة", rooms: ["كنيسة العذراء - الدور الارضي", "كنيسة مارجرجس - الدور العلوي", "المعمودية"] },
            { building: "مبنى الخدمات", rooms: ["اوضة 6", "اوضة 7", "المكتبة الصغيرة", "المكتبة الكبيرة", "الاوضة الازاز", "اوضة الدور الثالث", "قاعة الدور الثالث", "اوضة الدور الرابع", "قاعة الرابع"] },
            { building: "مبنى الكرمة", rooms: ["قاعة الامثال", "قاعة الرحلات", "قاعة الرسل", "قاعة جثيماني", "قاعة الجلجثة", "قاعة الموعظة", "قاعة الميلاد", "(88) قاعة الامثال", "(54) قاعة الرحلات", "(28) قاعة الرسل", "(49) قاعة النور المقدس", "(20) قاعة الجلجثة", "(20) قاعة الموعظة", "(20) قاعة الميلاد", "(88) قاعة البطاركة", "(54) قاعة مدرسة الاسكندرية", "(28) قاعة المدافعين", "(49) قاعة المجامع", "(20) قاعة النساك", "(20) قاعة الشهداء", "(20) قاعة المعترفين"] },
            { building: "النادي", rooms: ["غرفة ١", "غرفة ٢", "غرفة ٣", "غرفة ٤"] }
        ];

        const times = ["08:00 ص", "09:00 ص", "10:00 ص", "11:00 ص", "12:00 م", "01:00 م", "02:00 م", "03:00 م", "04:00 م", "05:00 م", "06:00 م", "07:00 م", "08:00 م", "09:00 م", "10:00 م"];

        function get24hTime(timeStr) {
            let parts = timeStr.split(' ');
            let time = parts[0].split(':');
            let hours = parseInt(time[0]);
            if (parts[1] === 'م' && hours !== 12) hours += 12;
            if (parts[1] === 'ص' && hours === 12) hours = 0;
            return hours;
        }

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'user' && pass === '1234') { currentUser = 'user'; loadApp(); showToast('تم تسجيل الدخول بنجاح', 'success'); }
            else if (user === 'admin' && pass === '1004') { currentUser = 'admin'; loadApp(); showToast('مرحباً بك في لوحة الإدارة', 'success'); }
            else { showToast('بيانات الدخول خاطئة!', 'error'); }
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('appScreen').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function getLocalDateStr() {
            const now = new Date();
            return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        }

        function loadApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'flex';
            document.getElementById('currentUserDisplay').innerText = currentUser === 'admin' ? 'المدير' : 'مستخدم';
            document.getElementById('adminBadge').style.display = currentUser === 'admin' ? 'block' : 'none';

            if (!document.getElementById('bookingDate').value) {
                document.getElementById('bookingDate').value = getLocalDateStr();
            }
            refreshUI();
        }

        function getBookings() { return JSON.parse(localStorage.getItem('bookingsDB')); }
        function saveBookings(data) { localStorage.setItem('bookingsDB', JSON.stringify(data)); }

        function showToast(message, type) {
            if (!type) type = 'info';
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            let icon = 'ℹ️';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';
            if (type === 'warning') icon = '⚠️';
            toast.innerHTML = '<span>' + icon + '</span> <span>' + message + '</span>';
            container.appendChild(toast);
            setTimeout(function () { toast.remove(); }, 3000);
        }

        function openBookingForm(room, time) {
            selectedRoom = room;
            selectedTime = time;
            const date = document.getElementById('bookingDate').value;
            if (!date) { showToast("برجاء اختيار التاريخ أولاً", "warning"); return; }
            document.getElementById('bookingForm').reset();
            document.getElementById('modalSubtitle').innerText = "المكان: " + room + " | الوقت: " + time + " | التاريخ: " + date;
            document.getElementById('btnSubmitForm').innerText = currentUser === 'admin' ? "تأكيد وإضافة مباشر" : "إرسال طلب الحجز";
            
            document.getElementById('recurringSection').style.display = currentUser === 'admin' ? 'block' : 'none';
            document.getElementById('endDateSection').style.display = 'none';

            document.getElementById('bookingModal').style.display = 'flex';
        }

        function closeModals() {
            document.getElementById('bookingModal').style.display = 'none';
            document.getElementById('detailsModal').style.display = 'none';
            selectedBookingId = null;
        }

        function submitBooking(event) {
            event.preventDefault();
            const startDate = document.getElementById('bookingDate').value;
            let bookings = getBookings();
            
            const isRecurring = document.getElementById('f_recurring') && document.getElementById('f_recurring').checked;
            const endDateStr = document.getElementById('f_end_date') ? document.getElementById('f_end_date').value : '';
            
            let datesToBook = [startDate];
            
            if (currentUser === 'admin' && isRecurring && endDateStr) {
                let currDate = new Date(startDate);
                let endDate = new Date(endDateStr);
                while (true) {
                    currDate.setDate(currDate.getDate() + 7);
                    if (currDate > endDate) break;
                    let dStr = currDate.getFullYear() + '-' + String(currDate.getMonth() + 1).padStart(2, '0') + '-' + String(currDate.getDate()).padStart(2, '0');
                    datesToBook.push(dStr);
                }
            }
            
            datesToBook.forEach(function(d) {
                let newBooking = {
                    id: Date.now() + Math.floor(Math.random() * 1000),
                    date: d,
                    room: selectedRoom,
                    time: selectedTime,
                    status: currentUser === 'admin' ? 'Approved' : 'Pending',
                    details: {
                        name: document.getElementById('f_name').value,
                        service: document.getElementById('f_service').value,
                        phone: document.getElementById('f_phone').value,
                        count: document.getElementById('f_count').value,
                        reason: document.getElementById('f_reason').value
                    }
                };
                bookings.push(newBooking);
            });

            saveBookings(bookings);
            closeModals();
            refreshUI();
            
            if(currentUser !== 'admin') {
                showToast("تم ارسال طلبك بنجاح. في انتظار موافقة الإدارة.", "success");
            } else {
                showToast("تم إضافة الحجز بنجاح.", "success");
            }
        }

        function openAdminDetails(bookingId) {
            const booking = getBookings().find(function (b) { return b.id === bookingId; });
            if (!booking) return;

            if (currentUser !== 'admin' && booking.status === 'Approved') {
                showToast("هذا الموعد محجوز مسبقاً.", "warning");
                return;
            }

            selectedBookingId = bookingId;
            const content = document.getElementById('detailsContent');
            let statusHtml = booking.status === 'Pending' ? '<span style="color:var(--warning-color);font-weight:bold;">قيد الانتظار</span>' : '<span style="color:var(--success-color);font-weight:bold;">موافق عليه</span>';

            content.innerHTML =
                '<p><strong>التاريخ:</strong> ' + booking.date + '</p>' +
                '<p><strong>المكان:</strong> ' + booking.room + ' (' + booking.time + ')</p>' +
                '<p><strong>المسؤول:</strong> ' + booking.details.name + '</p>' +
                '<p><strong>الخدمة:</strong> ' + booking.details.service + '</p>' +
                '<p><strong>الهاتف:</strong> ' + booking.details.phone + '</p>' +
                '<p><strong>العدد:</strong> ' + booking.details.count + ' أفراد</p>' +
                '<p><strong>السبب:</strong> ' + booking.details.reason + '</p>' +
                '<p><strong>الحالة:</strong> ' + statusHtml + '</p>';

            const actions = document.getElementById('detailsActions');
            if (currentUser === 'admin') {
                if (booking.status === 'Pending') {
                    actions.innerHTML =
                        '<button class="btn-success" onclick="updateStatus(\'Approved\')">موافقة ✓</button>' +
                        '<button class="btn-danger" onclick="deleteBooking()">رفض ✗</button>' +
                        '<button class="btn-secondary" onclick="closeModals()">إغلاق</button>';
                } else {
                    actions.innerHTML =
                        '<button class="btn-danger" onclick="deleteBooking()">إلغاء الحجز 🗑️</button>' +
                        '<button class="btn-secondary" onclick="closeModals()">إغلاق</button>';
                }
            } else {
                actions.innerHTML = '<button class="btn-secondary" onclick="closeModals()">إغلاق</button>';
            }

            document.getElementById('detailsModal').style.display = 'flex';
        }

        function updateStatus(newStatus) {
            let bookings = getBookings();
            let index = bookings.findIndex(function (b) { return b.id === selectedBookingId; });
            if (index !== -1) {
                bookings[index].status = newStatus;
                saveBookings(bookings);
                closeModals();
                refreshUI();
                showToast("تم التحديث بنجاح", "success");
            }
        }

        function deleteBooking() {
            if (confirm("هل أنت متأكد من حذف/رفض هذا الحجز؟")) {
                let bookings = getBookings();
                bookings = bookings.filter(function (b) { return b.id !== selectedBookingId; });
                saveBookings(bookings);
                closeModals();
                refreshUI();
                showToast("تم الحذف", "info");
            }
        }

        function refreshUI() {
            generateTimeHeaders();
            generateMatrix();
        }

        function generateTimeHeaders() {
            const tr = document.getElementById('timeHeaders');
            tr.innerHTML = '<th class="room-col">المكان</th>';

            const now = new Date();
            const currentHour = now.getHours();
            const isToday = document.getElementById('bookingDate').value === getLocalDateStr();

            times.forEach(function (time) {
                const th = document.createElement('th');
                const timeHour = get24hTime(time);

                let timeDisplay = time.split(' ')[0];
                let ampm = time.split(' ')[1];

                if (isToday && timeHour === currentHour) {
                    th.classList.add('current-time-header');
                    th.innerHTML = '<div>' + ampm + '</div><div class="current-time-badge">' + timeDisplay.split(':')[0] + '</div>';
                } else {
                    th.innerHTML = '<div>' + ampm + '</div><div style="font-size:16px; margin-top:5px; color:var(--text-color);">' + timeDisplay.split(':')[0] + '</div>';
                }
                tr.appendChild(th);
            });
        }

        function isElKarmaLocked(date) {
            let churchRoomsCount = 0;
            scheduleData.forEach(function (bldg) {
                if (bldg.building === "الكنيسة") {
                    churchRoomsCount += bldg.rooms.length;
                }
            });
            const totalChurchSlots = churchRoomsCount * times.length;

            const bookings = getBookings().filter(function (b) { return b.date === date; });
            let bookedChurchSlots = 0;
            bookings.forEach(function (b) {
                let isChurch = false;
                scheduleData.forEach(function (bldg) {
                    if (bldg.building === "الكنيسة" && bldg.rooms.includes(b.room)) {
                        isChurch = true;
                    }
                });
                if (isChurch) {
                    bookedChurchSlots++;
                }
            });

            return bookedChurchSlots < totalChurchSlots;
        }

        function generateMatrix() {
            const date = document.getElementById('bookingDate').value;
            const tbody = document.getElementById('matrixBody');
            tbody.innerHTML = '';

            const currentBookings = getBookings().filter(function (b) { return b.date === date; });

            // Filters
            const selectedBuilding = document.querySelector('input[name="building"]:checked').value;
            const showApproved = document.getElementById('filterApproved').checked;
            const showPending = document.getElementById('filterPending').checked;

            const now = new Date();
            const currentHour = now.getHours();
            const isToday = date === getLocalDateStr();
            const isPastDate = new Date(date) < new Date(getLocalDateStr());
            const elKarmaLocked = isElKarmaLocked(date);

            scheduleData.forEach(function (bldg) {
                if (selectedBuilding !== 'all' && bldg.building !== selectedBuilding) return;

                bldg.rooms.forEach(function (room) {
                    let tr = document.createElement('tr');

                    let tdRoom = document.createElement('td');
                    tdRoom.className = 'room-col';
                    tdRoom.innerText = room;

                    // Add a subtle building indicator
                    let bldgSpan = document.createElement('div');
                    bldgSpan.style.fontSize = '10px';
                    bldgSpan.style.color = 'var(--text-muted)';
                    bldgSpan.style.fontWeight = 'normal';
                    bldgSpan.innerText = bldg.building;
                    tdRoom.appendChild(bldgSpan);

                    tr.appendChild(tdRoom);

                    times.forEach(function (time) {
                        let tdTime = document.createElement('td');
                        tdTime.className = "time-slot";

                        const timeHour = get24hTime(time);
                        const isPastTime = isPastDate || (isToday && timeHour < currentHour);
                        const isElKarma = bldg.building === 'مبنى الكرمة';
                        const isLockedForUser = isElKarma && elKarmaLocked && currentUser !== 'admin';

                        if (isPastTime) {
                            tdTime.classList.add('past-time');
                        }

                        let slotBookings = currentBookings.filter(function (b) { return b.room === room && b.time === time; });
                        let approvedBooking = slotBookings.find(function(b) { return b.status === 'Approved'; });
                        let pendingBookings = slotBookings.filter(function(b) { return b.status === 'Pending'; });

                        if (isLockedForUser && !isPastTime) {
                            tdTime.innerHTML = '<div style="color:var(--text-muted); font-size:14px; display:flex; justify-content:center; align-items:center; height:100%;">🔒</div>';
                            tdTime.onclick = function () { showToast("مبنى الكرمة مغلق حتى يتم حجز مبنى الكنيسة بالكامل في هذا اليوم", "warning"); };
                        } else if (isPastTime) {
                            tdTime.classList.add('past-time');
                            tdTime.onclick = function () { showToast("لا يمكن الحجز في وقت قد مضى", "warning"); };
                            if (approvedBooking && showApproved) {
                                let eventDiv = document.createElement('div');
                                eventDiv.className = 'booking-event state-approved';
                                eventDiv.innerText = approvedBooking.details.name;
                                tdTime.appendChild(eventDiv);
                            }
                        } else {
                            if (approvedBooking && showApproved) {
                                tdTime.classList.add('has-booking');
                                let eventDiv = document.createElement('div');
                                eventDiv.className = 'booking-event state-approved';
                                eventDiv.innerText = approvedBooking.details.name;
                                tdTime.appendChild(eventDiv);
                                tdTime.onclick = function () { openAdminDetails(approvedBooking.id); };
                            } else {
                                tdTime.innerHTML = '<div class="hover-plus">+</div>';
                                tdTime.onclick = function () { openBookingForm(room, time); };
                                
                                if (pendingBookings.length > 0 && showPending) {
                                    tdTime.classList.add('has-booking');
                                    pendingBookings.forEach(function(pb) {
                                        let eventDiv = document.createElement('div');
                                        eventDiv.className = 'booking-event state-pending';
                                        eventDiv.innerText = pb.details.name;
                                        eventDiv.onclick = function(e) {
                                            e.stopPropagation();
                                            openAdminDetails(pb.id);
                                        };
                                        tdTime.appendChild(eventDiv);
                                    });
                                }
                            }
                        }

                        tr.appendChild(tdTime);
                    });
                    tbody.appendChild(tr);
                });
            });
        }
    </script>
</body>

</html>
